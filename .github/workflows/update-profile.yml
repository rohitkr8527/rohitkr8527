name: Update unified engineering activity

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate merged activity assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: >-
          python scripts/update_profile.py
          --github-user rohitkr8527
          --gitlab-user rohitkr8527
          --output assets

      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- assets/; then
            echo "No activity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/engineering-activity.svg assets/engineering-snake.svg assets/unified-activity.json
          git commit -m "chore: refresh engineering activity"
          git push
